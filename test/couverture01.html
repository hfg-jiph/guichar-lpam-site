<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>GUICHAR LPAM | Ultima Arx, Consilium Sapientis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- GSAP (sans intégrité pour éviter les blocages) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    :root {
      --bg-overlay: rgba(5, 5, 10, 0.75);
      --accent: #6A0F49;
      --accent-soft: rgba(106, 15, 73, 0.6);
      --text: #f5f5f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Montserrat', sans-serif;
      background: #050507;
      overflow: hidden;
    }

    /* --- BACKGROUND --- */
    .background {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url('https://images.pexels.com/photos/313782/pexels-photo-313782.jpeg?auto=compress&cs=tinysrgb&w=1920');
      background-size: cover;
      background-position: center;
      filter: saturate(1.1) contrast(1.1) brightness(0.8);
      transform: scale(1.05);
    }

    .background-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(138, 13, 90, 0.45), transparent 55%),
                  radial-gradient(circle at bottom right, rgba(10, 140, 190, 0.4), transparent 55%),
                  var(--bg-overlay);
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    /* --- MAIN CONTAINER --- */
    .page {
      position: relative;
      z-index: 1;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      padding: 2.5rem 3.5rem;
      border-radius: 28px;
      background: rgba(5, 5, 10, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      box-shadow:
        0 0 40px rgba(0, 0, 0, 0.7),
        0 0 80px rgba(106, 15, 73, 0.6);
      cursor: pointer;
      overflow: hidden;
    }

    .logo-img {
      width: min(260px, 70vw);
      height: auto;
      display: block;
      filter: drop-shadow(0 0 16px rgba(0, 0, 0, 0.8));
    }

    .tagline {
      font-size: 0.9rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(230, 230, 235, 0.9);
    }

    .subtitle {
      font-size: 0.9rem;
      color: rgba(210, 210, 220, 0.85);
    }

    .hint {
      margin-top: 0.2rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      color: rgba(190, 190, 200, 0.7);
    }

    .hint span {
      opacity: 0.5;
    }

    /* Glow circle en arrière-plan du logo */
    .logo-glow {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-soft), transparent 65%);
      filter: blur(3px);
      z-index: -1;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .logo-wrapper {
        padding: 1.8rem 1.9rem;
        border-radius: 22px;
      }

      .tagline {
        font-size: 0.75rem;
        letter-spacing: 0.18em;
      }

      .subtitle {
        font-size: 0.8rem;
        text-align: center;
      }

      .hint {
        font-size: 0.7rem;
        letter-spacing: 0.22em;
      }
    }
  </style>
</head>
<body>

  <!-- BACKGROUND -->
  <div class="background"></div>
  <div class="background-overlay"></div>

  <!-- CONTENT -->
  <div class="page">
    <div class="logo-wrapper" id="logoWrapper">
      <div class="logo-glow" id="logoGlow"></div>
      <!-- 🔴 Chemin corrigé -->
      <img src="img/logo_purple.png" alt="GUICHAR LPAM" class="logo-img" id="logoImg" />
      <div class="tagline">Consulting & Investments</div>
      <div class="subtitle">Strategic sparring partner & multi-asset investment office</div>
      <div class="hint"><span>⟶</span> Cliquer pour entrer</div>
    </div>
  </div>

  <script>
    // Vérification rapide que GSAP est bien chargé
    if (typeof gsap === "undefined") {
      console.error("GSAP n'est pas chargé. Vérifie bien la balise <script> du CDN.");
    } else {
      // Timeline d'arrivée
      const tl = gsap.timeline({ defaults: { ease: "power3.out" } });

      tl.from(".background", {
        scale: 1.1,
        duration: 1.5,
        opacity: 0.4
      })
      .from("#logoWrapper", {
        duration: 1.0,
        opacity: 0,
        y: 40,
        scale: 0.9
      }, "-=1.0")
      .from("#logoImg", {
        duration: 0.9,
        scale: 0.7,
        opacity: 0,
        filter: "blur(12px)"
      }, "-=0.6")
      .from(".tagline, .subtitle, .hint", {
        duration: 0.7,
        opacity: 0,
        y: 18,
        stagger: 0.12
      }, "-=0.4");

      // "Breathing" animation sur le logo
      gsap.to("#logoImg", {
        scale: 1.03,
        duration: 2.2,
        yoyo: true,
        repeat: -1,
        ease: "sine.inOut"
      });

      // légère pulsation de la lueur
      gsap.to("#logoGlow", {
        scale: 1.15,
        opacity: 1,
        duration: 3,
        yoyo: true,
        repeat: -1,
        ease: "sine.inOut"
      });

      // Parallax léger sur la souris
      const page = document.querySelector(".page");
      const background = document.querySelector(".background");
      const logoWrapper = document.getElementById("logoWrapper");

      page.addEventListener("mousemove", (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 12;
        const y = (e.clientY / window.innerHeight - 0.5) * 12;

        gsap.to(background, {
          duration: 0.6,
          x: x,
          y: y,
          ease: "power2.out"
        });

        gsap.to(logoWrapper, {
          duration: 0.5,
          x: x * 0.3,
          y: y * 0.3,
          ease: "power2.out"
        });
      });

      // Effet hover léger sur le logo-wrapper
      logoWrapper.addEventListener("mouseenter", () => {
        gsap.to(logoWrapper, {
          duration: 0.4,
          scale: 1.02,
          boxShadow: "0 0 50px rgba(106, 15, 73, 0.85)"
        });
      });

      logoWrapper.addEventListener("mouseleave", () => {
        gsap.to(logoWrapper, {
          duration: 0.4,
          scale: 1.0,
          boxShadow: "0 0 40px rgba(0, 0, 0, 0.7), 0 0 80px rgba(106, 15, 73, 0.6)"
        });
      });

      // Clic pour entrer sur le site
      logoWrapper.addEventListener("click", () => {
        const clickTl = gsap.timeline({
          defaults: { ease: "power3.inOut" },
          onComplete: () => {
            // 🔁 À ADAPTER : URL de ton site principal
            window.location.href = "index.html";
          }
        });

        clickTl.to("#logoWrapper", {
          duration: 0.5,
          scale: 1.06,
          opacity: 1,
          boxShadow: "0 0 80px rgba(255,255,255,0.9)"
        })
        .to("#logoWrapper", {
          duration: 0.55,
          scale: 0.75,
          opacity: 0,
          y: -80
        }, "-=0.1")
        .to(".background", {
          duration: 0.6,
          scale: 1.2,
          opacity: 0.35
        }, "-=0.4");
      });
    }
  </script>
</body>
</html>
